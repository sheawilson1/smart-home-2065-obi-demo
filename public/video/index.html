<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Obi Smart Home 2065 launch and demo video." />
    <title>Obi Smart Home 2065 Demo Video</title>
    <style>
      :root {
        color-scheme: dark;
        background: #050402;
        color: #fff1d7;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% 20%, rgba(245, 212, 161, 0.12), transparent 34%),
          radial-gradient(circle at 80% 80%, rgba(155, 125, 212, 0.12), transparent 32%),
          #050402;
        display: grid;
        place-items: center;
        padding: 28px;
      }

      main {
        width: min(1120px, 100%);
      }

      header {
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(34px, 5vw, 72px);
        font-weight: 400;
        line-height: 0.95;
      }

      p {
        margin: 12px 0 0;
        color: rgba(255, 241, 215, 0.72);
        font-size: 17px;
        line-height: 1.5;
      }

      video {
        width: 100%;
        aspect-ratio: 16 / 9;
        display: block;
        border-radius: 14px;
        border: 1px solid rgba(244, 222, 192, 0.16);
        background: #000;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
      }

      a {
        color: #f5d4a1;
      }

      footer {
        margin-top: 14px;
        font-size: 14px;
        color: rgba(255, 241, 215, 0.6);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Obi Smart Home 2065</h1>
        <p>Launch/demo video showing presence wake, personalised interfaces, voice/audio, and 360 visual portals.</p>
      </header>
      <video controls preload="metadata" poster="./obi-launch-demo-poster.png">
        <source src="./obi-launch-demo.mp4" type="video/mp4" />
      </video>
      <footer>
        Direct MP4: <a href="./obi-launch-demo.mp4">obi-launch-demo.mp4</a>
      </footer>
    </main>
  </body>
</html>
